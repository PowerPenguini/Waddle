[package]
name = "waddle"
version = "0.0.4"
edition = "2024"
license = "MIT"

[dependencies]
gio = { version = "0.22.8", features = ["v2_76"] }
iced = { version = "=0.14.0", features = ["advanced", "image", "svg", "tokio"] }
image = { version = "0.25.8", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
libc = "0.2.189"
resvg = "=0.45.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2.0.1"
smithay-client-toolkit = { version = "=0.19.2", default-features = false, features = ["calloop", "xkbcommon"] }
tokio = { version = "1.47", features = ["rt", "sync", "time"] }
wayland-backend = { version = "=0.3.16", features = ["client_system"] }
wayland-client = "=0.31.15"
x11rb = { version = "=0.13.2", features = ["xfixes"] }
zbus = "=5.19.0"

[dev-dependencies]
tempfile = "3.23.0"

# Iced does most frame rendering in dependencies. Optimizing those crates keeps
# `cargo run` responsive without making Waddle's own edit/build cycle as
# expensive as a full release build.
[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = "debuginfo"
