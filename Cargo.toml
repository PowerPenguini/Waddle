[package]
name = "polarexp"
version = "0.1.0"
edition = "2024"

[dependencies]
gio = "0.22.8"
iced = { version = "=0.14.0", features = ["advanced", "svg", "tokio"] }
libc = "0.2.189"
resvg = "=0.45.1"
smithay-client-toolkit = { version = "=0.19.2", default-features = false, features = ["calloop", "xkbcommon"] }
tokio = { version = "1.47", features = ["rt", "sync", "time"] }
wayland-backend = { version = "=0.3.16", features = ["client_system"] }
wayland-client = "=0.31.15"
x11rb = { version = "=0.13.2", features = ["xfixes"] }

[dev-dependencies]
tempfile = "3.23.0"

# Iced does most frame rendering in dependencies. Optimizing those crates keeps
# `cargo run` responsive without making PolarExp's own edit/build cycle as
# expensive as a full release build.
[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = "debuginfo"
